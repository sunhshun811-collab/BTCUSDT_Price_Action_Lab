<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTCUSDT Price Action Lab · 功能树</title>
<style>
:root{
  --bg:#f7f8fb; --toolbar:#3b3f4b; --card:#101a39; --card2:#152044;
  --line:#6983c8; --text:#f7f9ff; --muted:#aeb9d8; --accent:#87a6ff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg)}
#toolbar{position:fixed;left:8px;right:8px;top:8px;height:44px;z-index:100;
  display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:11px;
  background:var(--toolbar);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.22)
}
#title{font-size:15px;font-weight:700;white-space:nowrap}
#tip{font-size:12px;color:#d3d7e2;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge,.btn{
  height:24px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
  background:#273760;color:#fff;font-size:12px;padding:0 10px;display:inline-flex;align-items:center
}
.btn{cursor:pointer}
.btn:hover{filter:brightness(1.1)}
#saveBtn{background:#314d88}
#saveBtn.saved{background:#216c48}
#canvas{
  position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;
  cursor:grab;touch-action:none
}
#canvas.panning{cursor:grabbing}
#world{
  position:absolute;left:0;top:0;width:2400px;height:1700px;
  transform-origin:0 0;will-change:transform
}
#links{
  position:absolute;left:0;top:0;width:2400px;height:1700px;overflow:visible;pointer-events:none
}
.edge{stroke:var(--line);stroke-width:2;opacity:.86}
.node{position:absolute;width:220px;min-height:128px;
  border-radius:13px;background:linear-gradient(180deg,var(--card2),var(--card));
  color:var(--text);box-shadow:0 8px 22px rgba(14,25,56,.25);
  border:1px solid rgba(255,255,255,.08);user-select:none;touch-action:none;
  will-change:left,top;cursor:grab
}
.node.dragging{cursor:grabbing;box-shadow:0 12px 28px rgba(14,25,56,.38)}
.node.root{width:250px;background:linear-gradient(180deg,#1d2b59,#122044);border-color:rgba(135,166,255,.35)}
.head{padding:12px 13px 9px;font-size:15px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.08)}
.body{padding:10px 13px 11px;color:var(--muted);font-size:13px;line-height:1.58;white-space:pre-line}
.tags{padding:0 10px 9px;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10px;color:#dce5ff;background:rgba(255,255,255,.08);border-radius:9px;padding:3px 6px}
#legend{position:fixed;right:8px;bottom:8px;width:260px;z-index:80;padding:10px 12px;
  border-radius:10px;background:#3b3f4b;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2)
}
#legend b{font-size:14px}
#legend ul{padding-left:18px;margin:8px 0 0;color:#e0e3ed;font-size:12px;line-height:1.6}
#toast{
  position:fixed;right:16px;top:54px;z-index:150;
  background:#216c48;color:#fff;border-radius:8px;padding:8px 12px;font-size:11px;
  opacity:0;transform:translateY(-8px);transition:.18s;pointer-events:none
}
#toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div id="toolbar">
  <div id="title">BTCUSDT Price Action Lab · 功能树</div>
  <div id="tip">按住鼠标左键拖动功能块；空白处按住左键拖动画布；滚轮缩放。</div>
  <span class="badge">核心功能概览</span>
  <button class="btn" id="fitBtn">居中适配</button>
  <button class="btn" id="expandBtn">展开布局</button>
  <button class="btn" id="compactBtn">紧凑布局</button>
  <button class="btn" id="saveBtn">保存位置</button>
</div>

<div id="canvas">
  <div id="world"><svg id="links"></svg></div>
</div>

<div id="legend">
  <b>怎么看这个图</b>
  <ul>
    <li>中心是总系统，外圈是功能模块。</li>
    <li>每个模块框里列出主要能力。</li>
    <li>拖动功能块不会自动保存。</li>
    <li>摆好后点击右上角“保存位置”。</li>
    <li>刷新或重新打开后保持已保存布局。</li>
  </ul>
</div>
<div id="toast">位置已保存</div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'btcquant-function-tree-layout-v3';
  const W = 2400, H = 1700;

  const defaultNodes = [
    {id:'root',title:'BTCUSDT Price Action Lab',icon:'🧠',cls:'root',x:900,y:600,
      body:'围绕 BTCUSDT 的 Price Action / Market Structure 研究与可视化实验室。\n用于盘点功能、识别冗余模块、讨论保留与裁剪。',
      tags:['在线可视化','研究系统','可复现']},
    {id:'nav',title:'顶层入口',icon:'🧭',x:460,y:230,
      body:'主图编辑\n六周期总览\n人工教学数据\n策略开发室',tags:['导航层']},
    {id:'chart',title:'图表与主图编辑',icon:'📈',x:1320,y:170,
      body:'周期选择\n全局日期范围\n应用到全部周期\n当前光标信息\n8H / 4H / 1H / 15m / 5m / 1m',tags:['主载体','多周期']},
    {id:'drawing',title:'画图工具',icon:'✏️',x:1570,y:430,
      body:'选择 / 趋势线 / 水平位 / 撤销\n趋势线类型\n自动校准\n磁吸\n锚点重设\n删除选中线\n显示高周期趋势线',tags:['核心']},
    {id:'manual',title:'人工判断',icon:'🧑‍🏫',x:1580,y:800,
      body:'置信度\n强烈做多 / 偏多 / 不交易 / 偏空 / 强烈做空\n保存这个判断',tags:['标签沉淀','人工标注']},
    {id:'case',title:'结构案例研究室',icon:'🏗️',x:1240,y:1040,
      body:'锁定母结构\n选择买点研究区间\n理想买点区间\n低周期扫描\n候选卡 + 人工交易判断\n生成当前案例入场规则草案',tags:['核心','Structure Case']},
    {id:'ladder',title:'买点形成阶梯',icon:'🪜',x:790,y:1130,
      body:'L1 下跌衰竭\nL2 抬高低点（HL）\nL3 结构突破（BOS）\nL4 HL+BOS\nL5 重新收复+HL+BOS\n详情 / 时间轴 / 因子 / 理想区间',tags:['候选分析']},
    {id:'deriv',title:'衍生品上下文',icon:'🔬',x:370,y:940,
      body:'Funding\nOI\nBasis\nPositioning\n与主图十字光标联动\nK线与 Futures Metrics 协同观察',tags:['BTC特色','建议保留']},
    {id:'blind',title:'Blind Replay / 策略开发室',icon:'🎯',x:230,y:570,
      body:'随机 Blind Replay\n换一个案例\n抓取当前快照\n显示未来\n市场阶段概率\n六周期因果快照\nVeto / 保存完整研究样本\nMFE / MAE / 相似案例',tags:['二级化候选']},
    {id:'system',title:'系统与仓库层能力',icon:'⚙️',x:900,y:210,
      body:'Data Foundation V10\nBinance 公共行情数据接入\nSmoke Tests\nGitHub Actions 构建/部署\n.btcquantjob → VS Code → GitHub',tags:['基础设施']},
    {id:'src',title:'代码模块映射',icon:'🧩',x:700,y:70,
      body:'annotations.js\ndrawing_engine.js\ntrendline_calibration.js\ntrendline_research.js\nstructure_case_lab.js\nstructure_entry_lab.js\nresearch_ui.js\nstrategy.js\ndata_foundation_v10.js',tags:['src/']}
  ];

  const edges = [
    ['root','nav'],['root','chart'],['root','drawing'],['root','manual'],
    ['root','case'],['root','ladder'],['root','deriv'],['root','blind'],
    ['root','system'],['root','src'],
    ['chart','drawing'],['chart','manual'],['case','ladder'],['case','manual'],
    ['blind','manual'],['system','src']
  ];

  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (_) {}

  const nodes = defaultNodes.map(n => {
    const p = saved?.nodes?.[n.id];
    return {...n, x:Number.isFinite(p?.x)?p.x:n.x, y:Number.isFinite(p?.y)?p.y:n.y};
  });

  let scale = Number.isFinite(saved?.view?.scale) ? saved.view.scale : 0.72;
  let panX  = Number.isFinite(saved?.view?.panX)  ? saved.view.panX  : -40;
  let panY  = Number.isFinite(saved?.view?.panY)  ? saved.view.panY  : 15;

  const canvas = document.getElementById('canvas');
  const world = document.getElementById('world');
  const svg = document.getElementById('links');
  const toast = document.getElementById('toast');

  let edgeRaf = 0;
  let transformRaf = 0;

  function nodeById(id){ return nodes.find(n => n.id === id); }

  function renderNodes(){
    nodes.forEach(n => {
      const el = document.createElement('div');
      el.className = 'node ' + (n.cls || '');
      el.dataset.id = n.id;
      el.innerHTML =
        `<div class="head">${n.icon || '•'} ${n.title}</div>` +
        `<div class="body">${n.body}</div>` +
        `<div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
      world.appendChild(el);
      n.el = el;
      setNodePosition(n);
      bindNodeDrag(n);
    });
  }

  function setNodePosition(n){
    n.el.style.left = `${n.x}px`;
    n.el.style.top = `${n.y}px`;
  }

  function scheduleEdges(){
    if(edgeRaf) return;
    edgeRaf = requestAnimationFrame(() => { edgeRaf = 0; renderEdges(); });
  }

  function renderEdges(){
    svg.innerHTML = '';
    for(const [aId,bId] of edges){
      const a=nodeById(aId), b=nodeById(bId);
      if(!a?.el || !b?.el) continue;
      // Pure world-coordinate geometry: never derive positions through transformed DOM rects.
      const ax = a.x + a.el.offsetWidth/2;
      const ay = a.y + a.el.offsetHeight/2;
      const bx = b.x + b.el.offsetWidth/2;
      const by = b.y + b.el.offsetHeight/2;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',ax); line.setAttribute('y1',ay);
      line.setAttribute('x2',bx); line.setAttribute('y2',by);
      line.setAttribute('class','edge');
      svg.appendChild(line);
    }
  }

  function applyTransform(){
    world.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  }

  function scheduleTransform(){
    if(transformRaf) return;
    transformRaf = requestAnimationFrame(() => { transformRaf=0; applyTransform(); });
  }

  function bindNodeDrag(n){
    let active=false, sx=0, sy=0, ox=0, oy=0, pid=null;
    n.el.addEventListener('pointerdown',e=>{
      if(e.button!==0) return;
      active=true; pid=e.pointerId;
      sx=e.clientX; sy=e.clientY; ox=n.x; oy=n.y;
      n.el.classList.add('dragging');
      n.el.setPointerCapture(pid);
      e.stopPropagation();
    });
    n.el.addEventListener('pointermove',e=>{
      if(!active || e.pointerId!==pid) return;
      n.x = ox + (e.clientX-sx)/scale;
      n.y = oy + (e.clientY-sy)/scale;
      setNodePosition(n);
      scheduleEdges();
    });
    const stop=e=>{
      if(!active || e.pointerId!==pid) return;
      active=false; n.el.classList.remove('dragging');
      try{n.el.releasePointerCapture(pid)}catch(_){}
    };
    n.el.addEventListener('pointerup',stop);
    n.el.addEventListener('pointercancel',stop);
  }

  let panning=false, psx=0, psy=0, opx=0, opy=0, ppid=null;
  canvas.addEventListener('pointerdown',e=>{
    if(e.button!==0 || e.target.closest('.node')) return;
    panning=true; ppid=e.pointerId; psx=e.clientX; psy=e.clientY; opx=panX; opy=panY;
    canvas.classList.add('panning'); canvas.setPointerCapture(ppid);
  });
  canvas.addEventListener('pointermove',e=>{
    if(!panning || e.pointerId!==ppid) return;
    panX=opx+(e.clientX-psx); panY=opy+(e.clientY-psy); scheduleTransform();
  });
  const stopPan=e=>{
    if(!panning || e.pointerId!==ppid) return;
    panning=false; canvas.classList.remove('panning');
    try{canvas.releasePointerCapture(ppid)}catch(_){}
  };
  canvas.addEventListener('pointerup',stopPan);
  canvas.addEventListener('pointercancel',stopPan);

  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const wx=(mx-panX)/scale, wy=(my-panY)/scale;
    const next=Math.max(.42,Math.min(1.7,scale*(e.deltaY<0?1.08:.92)));
    panX=mx-wx*next; panY=my-wy*next; scale=next; scheduleTransform();
  },{passive:false});

  function fitView(){
    const minX=Math.min(...nodes.map(n=>n.x));
    const minY=Math.min(...nodes.map(n=>n.y));
    const maxX=Math.max(...nodes.map(n=>n.x+n.el.offsetWidth));
    const maxY=Math.max(...nodes.map(n=>n.y+n.el.offsetHeight));
    const top=66, pad=60;
    const cw=innerWidth, ch=innerHeight-top;
    scale=Math.min(1,(cw-pad*2)/(maxX-minX),(ch-pad*2)/(maxY-minY));
    panX=(cw-(maxX-minX)*scale)/2-minX*scale;
    panY=top+(ch-(maxY-minY)*scale)/2-minY*scale;
    applyTransform();
  }

  const compact = {
    root:[900,600],nav:[460,230],chart:[1320,170],drawing:[1570,430],manual:[1580,800],
    case:[1240,1040],ladder:[790,1130],deriv:[370,940],blind:[230,570],draft:[280,330],
    system:[900,210],src:[700,70]
  };
  const expanded = {
    root:[900,610],nav:[350,180],chart:[1400,100],drawing:[1760,390],manual:[1760,880],
    case:[1370,1160],ladder:[780,1300],deriv:[240,1110],blind:[90,580],draft:[180,300],
    system:[910,180],src:[680,35]
  };
  function applyLayout(map){
    nodes.forEach(n=>{ if(map[n.id]){n.x=map[n.id][0];n.y=map[n.id][1];setNodePosition(n);} });
    scheduleEdges(); setTimeout(fitView,20);
  }

  function showSaved(){
    const btn=document.getElementById('saveBtn');
    btn.textContent='已保存'; btn.classList.add('saved');
    toast.classList.add('show');
    setTimeout(()=>{btn.textContent='保存位置';btn.classList.remove('saved');toast.classList.remove('show');},900);
  }

  document.getElementById('saveBtn').addEventListener('click',()=>{
    const payload = {
      version:3,
      nodes:Object.fromEntries(nodes.map(n=>[n.id,{x:n.x,y:n.y}])),
      view:{scale,panX,panY}
    };
    localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));
    showSaved();
  });
  document.getElementById('fitBtn').addEventListener('click',fitView);
  document.getElementById('compactBtn').addEventListener('click',()=>applyLayout(compact));
  document.getElementById('expandBtn').addEventListener('click',()=>applyLayout(expanded));

  renderNodes();
  renderEdges();

  if(saved?.nodes){
    // Critical: do NOT call fitView when a saved layout exists.
    // Preserve exactly the saved node positions and saved viewport.
    applyTransform();
  }else{
    fitView();
  }

  window.addEventListener('resize',scheduleEdges);
})();
</script>
</body>
</html>
