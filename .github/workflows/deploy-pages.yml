name: Deploy Price Action Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: price-action-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach Data Foundation V10 from data-v10 branch
        run: |
          git fetch origin data-v10 || true
          if git show-ref --verify --quiet refs/remotes/origin/data-v10; then
            rm -rf public/data/v10
            git archive origin/data-v10 public/data/v10 | tar -x
            echo "Using GitHub data-v10 branch."
          else
            echo "data-v10 branch not built yet; frontend will use legacy data fallback."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
